name: Release

# Pushed tags release (ADR 0026):
#   v<version>      the server image, to ghcr.io/kwarf/storbild
#   sdk-v<version>  @storbild/plugin-sdk, to npmjs with trusted publishing

on:
  push:
    tags: ["v*", "sdk-v*"]

permissions:
  contents: read

jobs:
  image:
    if: startsWith(github.ref_name, 'v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Read the Bun version
        id: bun
        run: echo "version=$(cat .bun-version)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/kwarf/storbild
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Containerfile
          platforms: linux/amd64,linux/arm64
          build-args: BUN_VERSION=${{ steps.bun.outputs.version }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  sdk:
    if: startsWith(github.ref_name, 'sdk-v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - name: Check that the tag matches the SDK's version
        run: |
          version=$(bun -e 'console.log((await Bun.file("packages/plugin-sdk/package.json").json()).version)')
          test "$GITHUB_REF_NAME" = "sdk-v$version" || { echo "tag $GITHUB_REF_NAME is not sdk-v$version"; exit 1; }
      - name: Build, pack and check the SDK against the plugin template
        run: bun test packages/server/src/sdk-package.test.ts
        env:
          STORBILD_PACK: "1"
      - name: Build the SDK to publish
        run: bun run build
        working-directory: packages/plugin-sdk
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or later.
      - run: npm install -g npm@^11.5.1
      - run: npm publish --provenance --access public
        working-directory: packages/plugin-sdk/dist
